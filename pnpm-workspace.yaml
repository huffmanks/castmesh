packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  archiver: ^8.0.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  zustand: ^5.0.16
overrides:
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  react: "19.3.0"
  react-dom: "19.3.0"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  dtrace-provider: true
  protobufjs: true
